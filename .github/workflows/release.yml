name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go tool cue version
          go test ./...
          python3 -m unittest scripts/test_release.py -v
      - name: Verify generated source
        run: |
          go tool oapi-codegen -config api/oapi-client.yml api/schema.json
          go generate ./pkg/...
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Build release archives
        run: python3 scripts/release.py --tag "$GITHUB_REF_NAME" --dist dist
      - name: Attest archive checksums
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: dist/checksums.txt
      - name: Collect provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/braidplane-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
