name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go tool cue version
          go test ./...
          python3 -m unittest scripts/test_release.py -v
      - name: Verify generated source
        run: |
          go tool oapi-codegen -config api/oapi-client.yml api/schema.json
          go generate ./pkg/...
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Build
        run: go build -trimpath -buildvcs=false ./cmd/braidplane
